name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff + mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install lint tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch

      - name: ruff
        run: >
          python -m ruff check
          hermes_agentic_rl
          tests
          scripts/check_real_hermes.py
          scripts/ci_eval_gate_smoke.py

      - name: mypy
        run: python -m mypy --follow-imports=skip hermes_agentic_rl

  eval-gate-smoke:
    name: Eval Gate Smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install runtime + test extras
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install -e '.[rl,data,metrics,test]'

      - name: Run eval-gate smoke
        env:
          SMOKE_WORKDIR: ${{ runner.temp }}/eval-gate-smoke
        run: python scripts/ci_eval_gate_smoke.py --workdir "$SMOKE_WORKDIR"

      - name: Upload eval-gate smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-gate-smoke
          path: ${{ runner.temp }}/eval-gate-smoke

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install runtime + test extras
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install -e '.[rl,data,metrics,test]'

      - name: Run test suite with coverage
        run: >
          python -m pytest tests -q --maxfail=1 --disable-warnings
          --cov=hermes_agentic_rl
          --cov-report=term-missing
          --cov-report=xml

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml
