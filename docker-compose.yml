# Local development stack for hermes-agentic-rl.
#
# Usage:
#   docker compose run --rm dev pytest tests/test_mock_backend_core.py -q
#   docker compose run --rm dev make smoke
#   docker compose run --rm dev bash

services:
  dev:
    build:
      context: .
      target: runtime
    image: hermes-agentic-rl:dev
    working_dir: /opt/hermes-agentic-rl
    volumes:
      - .:/opt/hermes-agentic-rl
    environment:
      PYTHONPATH: /opt/hermes-agentic-rl
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    command: ["python", "-m", "hermes_agentic_rl.cli.main", "--help"]
    healthcheck:
      test: ["CMD", "python", "-c", "import hermes_agentic_rl; print('ok')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 1G

  smoke:
    build:
      context: .
      target: runtime
    image: hermes-agentic-rl:dev
    working_dir: /opt/hermes-agentic-rl
    volumes:
      - .:/opt/hermes-agentic-rl
    command:
      - python
      - -m
      - hermes_agentic_rl.cli.main
      - train-rl
      - --config
      - configs/echo_grpo_mvp.yaml
      - --output
      - /tmp/smoke_out
    healthcheck:
      test: ["CMD", "python", "-c", "import hermes_agentic_rl; print('ok')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 1G

  test:
    build:
      context: .
      target: runtime
    image: hermes-agentic-rl:dev
    working_dir: /opt/hermes-agentic-rl
    volumes:
      - .:/opt/hermes-agentic-rl
    environment:
      PYTHONPATH: /opt/hermes-agentic-rl
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    command: ["pytest", "tests", "-q"]
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 1G
