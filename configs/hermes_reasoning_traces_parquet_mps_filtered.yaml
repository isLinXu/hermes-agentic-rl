algo: grpo

backend:
  name: tiny
  dim: 48
  n_heads: 4
  n_layers: 3
  max_len: 1024
  device: mps
  dtype: float32
  seed: 0

environment:
  type: hermes_reasoning_traces
  dataset_path: data/hermes_reasoning_traces/train.parquet
  dataset_limit: 256
  streaming: false
  shuffle: false
  seed: 0
  history_window_messages: 8
  max_prompt_chars: 640
  min_target_chars: 16
  max_target_chars: 256
  require_target_substring: "<tool_call"
  max_assistant_turn_index: 3
  include_system_prompt: true
  tool_call_format_hint: true
  assistant_response_prefix: "<think>\n</think>\n<tool_call>\n"
  reward_weight: 1.0
  reward_mode: hybrid
  tool_call_reward_weight: 0.85
  text_reward_weight: 0.15

agent_loop:
  type: policy
  stop_strings:
    - "</tool_call>"

train_rl:
  n_iters: 24
  group_size: 4
  prompts_per_iter: 4
  lr: 0.0008
  max_new_tokens: 128
  # Keep rollout and learner logprobs on the same policy distribution.
  # Non-1.0 temperatures are now supported, but 1.0 gives a cleaner GRPO
  # trust-region signal for this tiny MPS learner.
  temperature: 1.0
  grad_clip: 0.5
  use_reference: true
  kl_coef: 0.01
  kl_estimator: k3
  target_kl: 0.02
  adaptive_kl: true
  update_epochs: 1
  minibatch_size: 8
  log_every: 1
  seed: 0
  advantage_eps: 1.0e-6
  bootstrap_sft_rounds: 8
  bootstrap_sft_samples: 32
  bootstrap_sft_lr: 0.0006
  bootstrap_sft_epochs: 1
  interleave_sft_every: 4
  interleave_sft_samples: 32
  interleave_sft_lr: 0.0003
  interleave_sft_epochs: 1
  interleave_sft_batch_size: 8
  save_every: 8
  checkpoint_every: 8
  keep_last_checkpoints: 2
  save_best_checkpoint: true

metrics:
  jsonl: true
  stdout: true
  tensorboard: true
  wandb:
    enabled: true
    project: hermes-agentic-rl
    name: hermes-reasoning-traces-parquet-mps-filtered
    prefix: train
    mode: online
    tags: [grpo, hermes_reasoning_traces, parquet, mps, filtered, hybrid-reward]
