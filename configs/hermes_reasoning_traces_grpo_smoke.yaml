algo: grpo

backend:
  name: tiny
  dim: 32
  n_heads: 4
  n_layers: 2
  max_len: 320
  seed: 0

environment:
  type: hermes_reasoning_traces
  dataset_name: lambda/hermes-agent-reasoning-traces
  dataset_config: kimi
  dataset_split: train
  dataset_limit: 1
  streaming: true
  shuffle: true
  seed: 0
  history_window_messages: 4
  max_prompt_chars: 240
  include_system_prompt: true
  reward_weight: 1.0

agent_loop:
  type: policy

train_rl:
  n_iters: 2
  group_size: 2
  prompts_per_iter: 1
  lr: 0.005
  max_new_tokens: 8
  temperature: 1.0
  update_epochs: 1
  minibatch_size: 2
  log_every: 1
  seed: 0
  advantage_eps: 1.0e-6
  bootstrap_sft_rounds: 1
  bootstrap_sft_samples: 1
  bootstrap_sft_lr: 0.0005
  bootstrap_sft_epochs: 1
  interleave_sft_every: 0

metrics:
  jsonl: true
  stdout: true
  tensorboard: true
  wandb:
    enabled: true
    project: hermes-agentic-rl
    name: hermes-reasoning-traces-smoke
    prefix: train
    mode: online
    tags: [grpo, hermes_reasoning_traces, smoke]
