# Offline DPO on a toy preference dataset.
#
# Run:
#   python -m hermes_agentic_rl.cli.main --config configs/offline_dpo_mvp.yaml offline
#
# data_path is a JSONL of DPOPair rows, one per line:
#   {"prompt_ids": [...], "chosen_ids": [...], "rejected_ids": [...]}
#
# For a quick smoke dataset, run the snippet at the bottom of this file in Python.

algo: dpo
data_path: data/dpo_pairs.jsonl
save_path: output/dpo_policy.pt

backend:
  seed: 0
  dim: 32
  n_heads: 4
  n_layers: 2
  max_len: 128

algo_config:
  n_epochs: 3
  batch_size: 4
  lr: 5.0e-4
  beta: 0.1
  grad_clip: 1.0
  seed: 0
  log_every: 1

