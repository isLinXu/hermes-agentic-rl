# Generated: 2026-06-24
# Rules-Ver: 3.0
# Context-ID: TRAE-ECHO-EVAL
#
# 目的：对比 baseline（随机初始化 Tiny）与 candidate（训练 checkpoint）
# 在同一批 echo items 上的 reward / success_rate，并输出 A/B 统计。
#
# 运行：
#   python -m hermes_agentic_rl.cli.main eval-rl --config configs/trae_echo_eval_rl.yaml --output output/trae_echo_eval
#
environment:
  type: echo

backend:
  name: tiny
  dim: 32
  n_heads: 4
  n_layers: 2
  max_len: 128
  seed: 0

eval_rl:
  name: trae-echo-eval
  n_rollouts: 64
  temperature: 0.0
  max_new_tokens: 8
  success_threshold: 0.80
  rank_metric: mean_reward

  # echo 没有 group_key；这里不做 split，直接 eval all items。
  split: all
  split_by: task_id
  val_ratio: 0.0
  test_ratio: 0.0
  seed: 0

  policies:
    - name: baseline
    - name: candidate
      checkpoint_dir: output/trae_echo_grpo_eval/checkpoints

metrics:
  jsonl: true
  stdout: true
  tensorboard: false
