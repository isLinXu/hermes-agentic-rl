algo: grpo

backend:
  name: tiny
  dim: 48
  n_heads: 4
  n_layers: 3
  max_len: 1024
  device: mps
  dtype: float32
  seed: 0

environment:
  type: hermes_reasoning_traces
  dataset_path: data/hermes_reasoning_traces/train.parquet
  dataset_limit: 256
  streaming: false
  shuffle: false
  seed: 0
  history_window_messages: 8
  max_prompt_chars: 640
  min_target_chars: 16
  max_target_chars: 256
  require_target_substring: '{"name": "terminal", "arguments": {"command": "'
  max_assistant_turn_index: 3
  include_system_prompt: true
  tool_call_format_hint: true
  # Stage 2 narrows the action space: the policy predicts only the shell
  # command, while the reward adapter wraps it back into a Hermes terminal call.
  assistant_response_adapter: terminal_command_tool_call
  assistant_response_suffix: "\n"
  reward_weight: 1.0
  reward_mode: hybrid
  tool_call_reward_weight: 0.45
  text_reward_weight: 0.55

agent_loop:
  type: policy
  stop_strings:
    - "\n"
    - "</tool_call>"
    - "```"

train_rl:
  n_iters: 32
  group_size: 4
  prompts_per_iter: 4
  lr: 0.0008
  max_new_tokens: 96
  temperature: 1.0
  grad_clip: 0.5
  use_reference: true
  kl_coef: 0.01
  kl_estimator: k3
  target_kl: 0.02
  adaptive_kl: true
  update_epochs: 1
  minibatch_size: 8
  log_every: 1
  seed: 0
  advantage_eps: 1.0e-6
  bootstrap_sft_rounds: 10
  bootstrap_sft_samples: 48
  bootstrap_sft_lr: 0.0006
  bootstrap_sft_epochs: 1
  interleave_sft_every: 4
  interleave_sft_samples: 48
  interleave_sft_lr: 0.0003
  interleave_sft_epochs: 1
  interleave_sft_batch_size: 8
  save_every: 8
  checkpoint_every: 8
  keep_last_checkpoints: 3
  save_best_checkpoint: true

metrics:
  jsonl: true
  stdout: true
  tensorboard: true
  wandb:
    enabled: true
    project: hermes-agentic-rl
    name: hermes-reasoning-traces-parquet-mps-terminal-command-stage2
    prefix: train
    mode: online
    tags: [grpo, hermes_reasoning_traces, parquet, mps, terminal-command, stage2]
