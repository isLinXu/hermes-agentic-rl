# Mixed curriculum learning — sample multiple difficulty levels concurrently.
# Run:
#   python -m hermes_agentic_rl.cli.main train-rl --config configs/mixed_curriculum_grpo.yaml

algo: grpo

backend:
  name: tiny
  dim: 48
  n_heads: 4
  n_layers: 2
  max_len: 192
  seed: 0

environment:
  type: mixed_curriculum
  window: 20
  target_success: 0.7
  adapt_lr: 0.1
  min_weight: 0.05
  weights: [1.0, 1.0, 1.0]
  levels:
    - type: echo
    - type: letter_counting
      max_level: 3
      dataset_seed: 1
    - type: letter_counting
      max_level: 7
      dataset_seed: 2

agent_loop:
  type: policy

train_rl:
  n_iters: 30
  group_size: 6
  prompts_per_iter: 2
  lr: 0.005
  max_new_tokens: 32
  temperature: 1.0
  clip_eps: 0.2
  kl_estimator: k3
  entropy_coef: 0.01
  log_every: 3
  seed: 7
