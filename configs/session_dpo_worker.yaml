# Replay-driven DPO worker.
#
# Run once:
#   python -m hermes_agentic_rl.cli.main \
#     --config configs/session_dpo_worker.yaml \
#     session-train-worker --once
#
# Run as a polling worker:
#   python -m hermes_agentic_rl.cli.main \
#     --config configs/session_dpo_worker.yaml \
#     session-train-worker
#
# This worker rescans the full judged replay file whenever it changes so
# newly arrived samples can form preference pairs with older responses.

algo: dpo
input_path: outputs/hermes_replay.jsonl
save_path: outputs/session_dpo_policy.pt
state_path: outputs/session_dpo_worker_state.json
quarantine_path: outputs/session_dpo_quarantine.jsonl

backend:
  name: tiny
  dim: 32
  n_heads: 4
  n_layers: 2

train:
  n_epochs: 1
  batch_size: 4
  lr: 0.0005
  beta: 0.1
  train_only_new_pairs: true
  max_pairs_per_update: 64
  min_reward: 0.0
  poll_interval_sec: 1.0
  max_idle_polls: 0
  preference:
    min_reward_gap: 0.25
    max_pairs_per_prompt: 2
  # Optional replay quality gates:
  # data_quality:
  #   min_prompt_tokens: 2
  #   min_response_tokens: 2
  #   max_abs_reward: 5.0
  #   dedupe_within_scan: true

metrics:
  jsonl: outputs/session_dpo_metrics.jsonl

# Optional live dashboard for worker metrics:
# dashboard:
#   enabled: true
#   host: 127.0.0.1
#   port: 8765
