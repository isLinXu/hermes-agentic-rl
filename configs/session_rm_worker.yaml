# Replay-driven reward-model worker.
#
# Run once:
#   python -m hermes_agentic_rl.cli.main \
#     --config configs/session_rm_worker.yaml \
#     session-train-worker --once
#
# The saved checkpoint contains the reward head state_dict only.

algo: rm
input_path: outputs/hermes_replay.jsonl
save_path: outputs/session_rm_head.pt
state_path: outputs/session_rm_worker_state.json
quarantine_path: outputs/session_rm_quarantine.jsonl

backend:
  name: tiny
  dim: 32
  n_heads: 4
  n_layers: 2

train:
  n_epochs: 1
  batch_size: 4
  lr: 0.001
  freeze_base: true
  train_only_new_pairs: true
  max_pairs_per_update: 64
  min_reward: 0.0
  poll_interval_sec: 1.0
  max_idle_polls: 0
  preference:
    min_reward_gap: 0.25
    max_pairs_per_prompt: 2
  # Optional replay quality gates:
  # data_quality:
  #   min_prompt_tokens: 2
  #   min_response_tokens: 2
  #   max_abs_reward: 5.0
  #   dedupe_within_scan: true

metrics:
  jsonl: outputs/session_rm_metrics.jsonl

# Optional live dashboard for worker metrics:
# dashboard:
#   enabled: true
#   host: 127.0.0.1
#   port: 8765
