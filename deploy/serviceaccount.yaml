---
# hermes-agentic-rl ServiceAccount + minimal RBAC
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hermes-training-sa
  namespace: hermes-agentic-rl
  labels:
    app.kubernetes.io/name: hermes-agentic-rl
    app.kubernetes.io/component: training
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: hermes-training-role
  namespace: hermes-agentic-rl
rules:
  - apiGroups: [""]
    resources: ["configmaps", "secrets"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: hermes-training-rb
  namespace: hermes-agentic-rl
subjects:
  - kind: ServiceAccount
    name: hermes-training-sa
    namespace: hermes-agentic-rl
roleRef:
  kind: Role
  name: hermes-training-role
  apiGroup: rbac.authorization.k8s.io
