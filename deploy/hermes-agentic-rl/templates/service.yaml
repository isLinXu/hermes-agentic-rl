{{- if eq .Values.workloadType "deployment" }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "hermes-agentic-rl.fullname" . }}
  labels:
    {{- include "hermes-agentic-rl.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
      name: http
  selector:
    {{- include "hermes-agentic-rl.selectorLabels" . | nindent 4 }}
{{- end }}
