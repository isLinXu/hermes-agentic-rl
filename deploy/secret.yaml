---
# Secret template — populate with real values before applying.
# Usage: kubectl create secret generic hermes-secrets -n hermes-agentic-rl \
#   --from-literal=HF_TOKEN=xxx \
#   --from-literal=WANDB_API_KEY=xxx \
#   --from-literal=OPENAI_API_KEY=xxx
apiVersion: v1
kind: Secret
metadata:
  name: hermes-secrets
  namespace: hermes-agentic-rl
  labels:
    app.kubernetes.io/name: hermes-agentic-rl
    app.kubernetes.io/component: secrets
type: Opaque
stringData:
  HF_TOKEN: "REPLACE_ME"
  WANDB_API_KEY: "REPLACE_ME"
  OPENAI_API_KEY: "REPLACE_ME"
