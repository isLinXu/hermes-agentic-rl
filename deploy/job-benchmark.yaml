---
# Benchmark suite Job — runs benchmark-suite command for systematic evaluation.
# Results are written to /data/output/benchmark/$(date +%Y%m%d_%H%M%S).
apiVersion: batch/v1
kind: Job
metadata:
  name: hermes-benchmark
  namespace: hermes-agentic-rl
  labels:
    app.kubernetes.io/name: hermes-agentic-rl
    app.kubernetes.io/component: benchmark
spec:
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hermes-agentic-rl
        app.kubernetes.io/component: benchmark
    spec:
      serviceAccountName: hermes-training-sa
      restartPolicy: OnFailure
      containers:
        - name: benchmark
          image: hermes-agentic-rl:1.0.0-rc1
          imagePullPolicy: IfNotPresent
          workingDir: /opt/hermes-agentic-rl
          command:
            - /bin/sh
            - -c
            - |
              TIMESTAMP=$(date +%Y%m%d_%H%M%S)
              python -m hermes_agentic_rl.cli.main benchmark-suite \
                --config configs/benchmark_suite.yaml \
                --output /data/output/benchmark/${TIMESTAMP}
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hermes-secrets
                  key: HF_TOKEN
                  optional: true
            - name: WANDB_API_KEY
              valueFrom:
                secretKeyRef:
                  name: hermes-secrets
                  key: WANDB_API_KEY
                  optional: true
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              cpu: "4"
              memory: 8Gi
          volumeMounts:
            - name: hermes-data
              mountPath: /data
            - name: hermes-configs
              mountPath: /opt/hermes-agentic-rl/configs
              readOnly: true
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: hermes-data
          persistentVolumeClaim:
            claimName: hermes-data
        - name: hermes-configs
          configMap:
            name: hermes-configs
