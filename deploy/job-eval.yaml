---
# RL evaluation Job — runs eval-rl or eval-gate against a trained checkpoint.
# Override the config and checkpoint path via ConfigMap or init-container.
apiVersion: batch/v1
kind: Job
metadata:
  name: hermes-eval
  namespace: hermes-agentic-rl
  labels:
    app.kubernetes.io/name: hermes-agentic-rl
    app.kubernetes.io/component: eval
spec:
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hermes-agentic-rl
        app.kubernetes.io/component: eval
    spec:
      serviceAccountName: hermes-training-sa
      restartPolicy: OnFailure
      containers:
        - name: eval
          image: hermes-agentic-rl:1.0.0-rc1
          imagePullPolicy: IfNotPresent
          workingDir: /opt/hermes-agentic-rl
          command:
            - python
            - -m
            - hermes_agentic_rl.cli.main
            - eval-rl
            - --config
            - configs/echo_grpo_mvp.yaml
            - --output
            - /data/output/eval
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hermes-secrets
                  key: HF_TOKEN
                  optional: true
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              cpu: "2"
              memory: 4Gi
          volumeMounts:
            - name: hermes-data
              mountPath: /data
            - name: hermes-configs
              mountPath: /opt/hermes-agentic-rl/configs
              readOnly: true
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: hermes-data
          persistentVolumeClaim:
            claimName: hermes-data
        - name: hermes-configs
          configMap:
            name: hermes-configs
