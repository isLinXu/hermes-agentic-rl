# Kubernetes Service
# 暴露 hermes-rl 服务端口

apiVersion: v1
kind: Service
metadata:
  name: hermes-rl
  namespace: default
  labels:
    app: hermes-agentic-rl
    version: v1.0.0-rc1
spec:
  type: ClusterIP
  selector:
    app: hermes-agentic-rl
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
    - name: metrics
      port: 9090
      targetPort: 9090
      protocol: TCP

---
# 可选：NodePort 类型（用于外部访问测试）
apiVersion: v1
kind: Service
metadata:
  name: hermes-rl-nodeport
  namespace: default
  labels:
    app: hermes-agentic-rl
    version: v1.0.0-rc1
spec:
  type: NodePort
  selector:
    app: hermes-agentic-rl
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30080
      protocol: TCP
