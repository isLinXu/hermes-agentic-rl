---
# HorizontalPodAutoscaler for TensorBoard.
# Scales between 1 and 3 replicas based on CPU utilisation.
# Note: training Jobs are NOT autoscaled — they run to completion.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: hermes-tensorboard-hpa
  namespace: hermes-agentic-rl
  labels:
    app.kubernetes.io/name: hermes-agentic-rl
    app.kubernetes.io/component: tensorboard
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: hermes-tensorboard
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 100
          periodSeconds: 60
