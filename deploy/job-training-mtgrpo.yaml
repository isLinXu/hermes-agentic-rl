---
# MTGRPO training Job (multi-turn + per-token advantage).
# Suitable for curriculum-based multi-turn RL experiments.
apiVersion: batch/v1
kind: Job
metadata:
  name: hermes-training-mtgrpo
  namespace: hermes-agentic-rl
  labels:
    app.kubernetes.io/name: hermes-agentic-rl
    app.kubernetes.io/component: training
    app.kubernetes.io/algorithm: mtgrpo
spec:
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hermes-agentic-rl
        app.kubernetes.io/component: training
        app.kubernetes.io/algorithm: mtgrpo
    spec:
      serviceAccountName: hermes-training-sa
      restartPolicy: OnFailure
      containers:
        - name: train
          image: hermes-agentic-rl:1.0.0-rc1
          imagePullPolicy: IfNotPresent
          workingDir: /opt/hermes-agentic-rl
          command:
            - python
            - -m
            - hermes_agentic_rl.cli.main
            - train-rl
            - --config
            - configs/mtgrpo_tiny.yaml
            - --output
            - /data/output/mtgrpo
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hermes-secrets
                  key: HF_TOKEN
                  optional: true
            - name: WANDB_API_KEY
              valueFrom:
                secretKeyRef:
                  name: hermes-secrets
                  key: WANDB_API_KEY
                  optional: true
          resources:
            requests:
              cpu: "2"
              memory: 4Gi
            limits:
              cpu: "4"
              memory: 8Gi
          volumeMounts:
            - name: hermes-data
              mountPath: /data
            - name: hermes-configs
              mountPath: /opt/hermes-agentic-rl/configs
              readOnly: true
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: hermes-data
          persistentVolumeClaim:
            claimName: hermes-data
        - name: hermes-configs
          configMap:
            name: hermes-configs
      tolerations:
        - key: "dedicated"
          operator: "Equal"
          value: "training"
          effect: "NoSchedule"
